name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Create CI env (throwaway secrets, never committed)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^LOCAL_MASTER_KEY=.*|LOCAL_MASTER_KEY=$(openssl rand -base64 32 | tr -d '\n')|" .env
      - name: Start Postgres (pgvector) and Redis
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d postgres redis
          for i in $(seq 1 30); do
            docker compose -f infrastructure/docker/docker-compose.yml --env-file .env ps --format '{{.Name}} {{.Status}}' | grep -c healthy | grep -q '^2$' && break
            sleep 2
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Boot the built API under plain Node (guards against tooling-specific DI breakage)
        run: pnpm --filter @leadpilot/api smoke
