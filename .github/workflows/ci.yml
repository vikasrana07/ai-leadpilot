name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Create CI env (throwaway secrets, never committed)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^LOCAL_MASTER_KEY=.*|LOCAL_MASTER_KEY=$(openssl rand -base64 32 | tr -d '\n')|" .env
      - name: Start Postgres (pgvector), Redis, MinIO and ClamAV
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d postgres redis minio clamav
          # ClamAV loads virus signatures on first start, which can take a few minutes
          for i in $(seq 1 90); do
            docker compose -f infrastructure/docker/docker-compose.yml --env-file .env ps --format '{{.Name}} {{.Status}}' | grep -c healthy | grep -q '^4$' && break
            sleep 5
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Boot the built API under plain Node (guards against tooling-specific DI breakage)
        run: pnpm --filter @leadpilot/api smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Create CI env (throwaway secrets, never committed)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^LOCAL_MASTER_KEY=.*|LOCAL_MASTER_KEY=$(openssl rand -base64 32 | tr -d '\n')|" .env
      - name: Start Postgres (pgvector), Redis, MinIO and ClamAV
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d postgres redis minio clamav
          for i in $(seq 1 90); do
            docker compose -f infrastructure/docker/docker-compose.yml --env-file .env ps --format '{{.Name}} {{.Status}}' | grep -c healthy | grep -q '^4$' && break
            sleep 5
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Google Chrome (preinstalled on the runner; the suite drives it via channel "chrome", no browser download)
        run: google-chrome --version
      - name: End-to-end tests (builds web + API, starts them on :3200 / :4100, runs Playwright)
        run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
