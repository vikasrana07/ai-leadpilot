# Host ports are deliberately non-default (5433/6380/...) to avoid clashing with other local stacks.
name: leadpilot
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: leadpilot
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD}
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1026:1025", "8026:8025"]
  # S3-compatible storage for local dev. Production uses real S3 (the code only speaks the standard S3 API).
  # The official minio/minio image is not pullable from Docker Hub any more, so dev uses the legacy Bitnami build.
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-leadpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-leadpilot-files}
    ports: ["${MINIO_HOST_PORT:-9100}:9000", "${MINIO_CONSOLE_PORT:-9101}:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64   # no arm64 image is published; runs emulated on Apple silicon
    ports: ["${CLAMAV_HOST_PORT:-3310}:3310"]
    volumes: [clamdata:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
volumes:
  pgdata:
  miniodata:
  clamdata:
